services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: uptimeforge
      POSTGRES_PASSWORD: uptimeforge
      POSTGRES_DB: uptimeforge
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
